const SPICY_LEVELS = ["不辣", "小辣", "中辣", "大辣"];
const OPEN_HOUR = 16;
const CLOSE_HOUR = 23;
const CLOSED_WEEKDAY = 1;

function absoluteDateLabel(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return `${m}/${d} (${"日一二三四五六"[date.getDay()]})`;
}

function getUpcomingDates() {
  const days = [];
  const now = new Date();
  for (let i = 0; i < 8 && days.length < 6; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() + i);
    if (d.getDay() === CLOSED_WEEKDAY) continue;
    const label = i === 0 ? "今天" : i === 1 ? "明天" : `${d.getMonth() + 1}/${d.getDate()} (${"日一二三四五六"[d.getDay()]})`;
    days.push({ key: d.toISOString().slice(0, 10), label, date: d, isToday: i === 0 });
  }
  return days;
}

function getSlotsForDate(dateInfo) {
  const slots = [];
  const now = new Date();
  const earliest = new Date(now.getTime() + 20 * 60000);
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
    for (let m = 0; m < 60; m += 15) {
      const slotDate = new Date(dateInfo.date);
      slotDate.setHours(h, m, 0, 0);
      if (dateInfo.isToday && slotDate < earliest) continue;
      slots.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
    }
  }
  return slots;
}

          <h2 style={{ color: "#F5EEDD", margin: "8px 0 0", fontSize: 18, letterSpacing: 2 }}>訂單已送出</h2>
          <p style={{ color: "#A79980", fontSize: 12, marginTop: 4 }}>請於取餐時間到店付現取餐</p>
        </div>
        <div style={{ borderTop: "1px dashed #3A3122", paddingTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
          <Row label="取餐人" value={order.name} />
          <Row label="電話" value={order.phone} />
          <Row label="取餐時間" value={`${order.dateLabel} ${order.time}`} />
        </div>
        <div style={{ borderTop: "1px dashed #3A3122", marginTop: 12, paddingTop: 12 }}>
          {order.cart.map((i) => (
            <div key={i.cartId} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#D9CFB8", marginBottom: 4 }}>
              <span>{i.name} {i.size} x{i.qty}</span><span>{money(i.unitPrice * i.qty)}</span>
            </div>
          ))}
        </div>
        <div style={{ borderTop: "1px dashed #3A3122", marginTop: 10, paddingTop: 10, display: "flex", justifyContent: "space-between" }}>
          <span style={{ color: "#D9CFB8", fontWeight: 700 }}>總金額</span>
          <span style={{ color: "#F0A202", fontWeight: 800, fontSize: 18 }}>{money(order.total)}</span>
        </div>
      </div>
      <button onClick={onDone} style={{ marginTop: 20, background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 12, padding: "10px 24px", cursor: "pointer", fontSize: 14 }}>
        回到菜單繼續點餐
      </button>
      <button onClick={onClear} style={{ marginTop: 10, background: "none", border: "none", color: "#A79980", cursor: "pointer", fontSize: 12, textDecoration: "underline" }}>
        已取餐完成,清除這筆紀錄

function LoginView({ onLoggedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError("");
    setLoading(true);
    const { error } = await db.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) {
      setError("帳號或密碼錯誤,請再確認一次。");
      return;
    }
    onLoggedIn();
  };

  return (
    <div style={{ maxWidth: 320, margin: "40px auto 0" }}>
      <h3 style={{ color: "#F5EEDD", marginBottom: 16, textAlign: "center" }}>店家登入</h3>
      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 13, color: "#F0A202", fontWeight: 700, letterSpacing: 1, display: "block", marginBottom: 6 }}>Email</label>
        <input value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle} />
      </div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, color: "#F0A202", fontWeight: 700, letterSpacing: 1, display: "block", marginBottom: 6 }}>密碼</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={inputStyle} onKeyDown={(e) => e.key === "Enter" && submit()} />
      </div>
      {error && <p style={{ color: "#D64933", fontSize: 13, marginBottom: 12 }}>{error}</p>}
      <button onClick={submit} disabled={loading} style={{ width: "100%", background: "#D64933", color: "#FFF3EC", border: "none", borderRadius: 14, padding: "12px 0", fontSize: 15, fontWeight: 800, cursor: loading ? "default" : "pointer", opacity: loading ? 0.6 : 1 }}>
        {loading ? "登入中..." : "登入"}

}

function ProductForm({ product, onCancel, onSaved }) {
  const isNew = !product;
  const [name, setName] = useState(product?.name || "");
  const [sizes, setSizes] = useState(product?.sizes?.length ? product.sizes.map((s) => ({ ...s })) : [{ label: "", price: "" }]);
  const [addons, setAddons] = useState(product?.addons?.length ? [...product.addons] : []);
  const [imageFile, setImageFile] = useState(null);
  const [imagePreview, setImagePreview] = useState(product?.image_url || null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const updateSize = (i, field, val) => setSizes((prev) => prev.map((s, idx) => (idx === i ? { ...s, [field]: val } : s)));
  const removeSize = (i) => setSizes((prev) => prev.filter((_, idx) => idx !== i));
  const addSize = () => setSizes((prev) => [...prev, { label: "", price: "" }]);

  const updateAddon = (i, val) => setAddons((prev) => prev.map((a, idx) => (idx === i ? val : a)));
  const removeAddon = (i) => setAddons((prev) => prev.filter((_, idx) => idx !== i));
  const addAddon = () => setAddons((prev) => [...prev, ""]);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImageFile(file);
    setImagePreview(URL.createObjectURL(file));
  };

  const save = async () => {
    setError("");
    if (!name.trim()) return setError("請填寫商品名稱");
    const cleanSizes = sizes.filter((s) => s.label.trim() && s.price !== "").map((s) => ({ label: s.label.trim(), price: Number(s.price) }));
    if (cleanSizes.length === 0) return setError("至少需要一個份量選項(名稱與價錢)");
    const cleanAddons = addons.map((a) => a.trim()).filter(Boolean);

    setSaving(true);
    let imageUrl = product?.image_url || null;
    if (imageFile) {
      const ext = (imageFile.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g, "").toLowerCase() || "jpg";
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error: upErr } = await db.storage.from("product-images").upload(path, imageFile);
      if (upErr) {
        setSaving(false);
        return setError("圖片上傳失敗:" + upErr.message);
      }
      const { data: pub } = db.storage.from("product-images").getPublicUrl(path);
      imageUrl = pub.publicUrl;
    }

    const id = product?.id || `p_${Date.now()}`;
    const row = {
      id, name: name.trim(), image_url: imageUrl, sizes: cleanSizes, addons: cleanAddons,
      sort_order: product?.sort_order ?? Date.now(), created_at: product?.created_at ?? Date.now(),
    };
    const { error: saveErr } = await db.from("products").upsert([row]);
    setSaving(false);
    if (saveErr) return setError("儲存失敗:" + saveErr.message);
    onSaved();
  };

  return (
    <div style={{ background: "#211C15", border: "1px solid #3A3122", borderRadius: 14, padding: 16, marginBottom: 16 }}>
      <h4 style={{ color: "#F5EEDD", margin: "0 0 14px" }}>{isNew ? "新增商品" : "編輯商品"}</h4>

      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#F0A202", fontWeight: 700, display: "block", marginBottom: 6 }}>商品圖片</label>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {imagePreview ? (
            <img src={imagePreview} alt="" style={{ width: 56, height: 56, borderRadius: 10, objectFit: "cover" }} />
          ) : (
            <div style={{ width: 56, height: 56, borderRadius: 10, background: "#1A1611", display: "flex", alignItems: "center", justifyContent: "center" }}><PlaceholderIcon size={40} /></div>
          )}
          <input type="file" accept="image/*" onChange={handleFile} style={{ color: "#D9CFB8", fontSize: 12 }} />
        </div>
        <p style={{ color: "#A79980", fontSize: 11, marginTop: 6 }}>不上傳的話,菜單會顯示可愛的鹹酥雞圖示代替。</p>
      </div>

      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#F0A202", fontWeight: 700, display: "block", marginBottom: 6 }}>商品名稱</label>
        <input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} />
      </div>

      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#F0A202", fontWeight: 700, display: "block", marginBottom: 6 }}>份量選項(名稱與價錢)</label>
        {sizes.map((s, i) => (
          <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={s.label} onChange={(e) => updateSize(i, "label", e.target.value)} placeholder="例如:中份" style={{ ...inputStyle, flex: 2 }} />
            <input value={s.price} onChange={(e) => updateSize(i, "price", e.target.value.replace(/[^0-9]/g, ""))} placeholder="價錢" style={{ ...inputStyle, flex: 1 }} />
            <button onClick={() => removeSize(i)} style={{ background: "none", border: "1px solid #3A3122", color: "#D64933", borderRadius: 10, padding: "0 12px", cursor: "pointer" }}>✕</button>
          </div>
        ))}
        <button onClick={addSize} style={{ background: "none", border: "1px dashed #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>+ 新增份量選項</button>
      </div>

      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 12, color: "#F0A202", fontWeight: 700, display: "block", marginBottom: 6 }}>辣度</label>
        <p style={{ color: "#A79980", fontSize: 12 }}>固定為 {SPICY_LEVELS.join("、")},每樣商品都相同,不需要另外設定。</p>
      </div>

      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 12, color: "#F0A202", fontWeight: 700, display: "block", marginBottom: 6 }}>加料選項(可複選)</label>
        {addons.map((a, i) => (
          <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={a} onChange={(e) => updateAddon(i, e.target.value)} placeholder="例如:胡椒鹽" style={{ ...inputStyle, flex: 1 }} />
            <button onClick={() => removeAddon(i)} style={{ background: "none", border: "1px solid #3A3122", color: "#D64933", borderRadius: 10, padding: "0 12px", cursor: "pointer" }}>✕</button>
          </div>
        ))}
        <button onClick={addAddon} style={{ background: "none", border: "1px dashed #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>+ 新增加料選項</button>
      </div>

      {error && <p style={{ color: "#D64933", fontSize: 13, marginBottom: 12 }}>{error}</p>}

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={onCancel} style={{ flex: 1, background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 12, padding: "10px 0", cursor: "pointer" }}>取消</button>
        <button onClick={save} disabled={saving} style={{ flex: 2, background: "#D64933", color: "#FFF3EC", border: "none", borderRadius: 12, padding: "10px 0", fontWeight: 700, cursor: saving ? "default" : "pointer", opacity: saving ? 0.6 : 1 }}>
          {saving ? "儲存中..." : "儲存商品"}
        </button>
      </div>
    </div>
  );
}

function ProductsManager() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [editing, setEditing] = useState(undefined); // undefined = not editing, null = new, object = editing existing

  const loadProducts = async () => {
    setLoading(true);
    const { data, error } = await db.from("products").select("*").order("sort_order", { ascending: true });
    if (error) setErr("讀取商品失敗:" + error.message);
    else setProducts(data);
    setLoading(false);
  };

  useEffect(() => { loadProducts(); }, []);

  const deleteProduct = async (p) => {
    if (!window.confirm(`確定要刪除「${p.name}」嗎?這個動作無法復原。`)) return;
    const { error } = await db.from("products").delete().eq("id", p.id);
    if (!error) setProducts((prev) => prev.filter((x) => x.id !== p.id));
  };

  if (editing !== undefined) {
    return <ProductForm product={editing} onCancel={() => setEditing(undefined)} onSaved={() => { setEditing(undefined); loadProducts(); }} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h3 style={{ color: "#F5EEDD", margin: 0, fontSize: 16 }}>商品管理({products.length})</h3>
        <button onClick={() => setEditing(null)} style={{ background: "#F0A20222", border: "1px solid #F0A202", color: "#F0A202", borderRadius: 10, padding: "6px 14px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
          + 新增商品
        </button>
      </div>
      {err && <p style={{ color: "#D64933", fontSize: 13 }}>{err}</p>}
      {loading ? (
        <p style={{ color: "#A79980" }}>載入中...</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {products.map((p) => {
            const minPrice = Math.min(...p.sizes.map((s) => s.price));
            return (
              <div key={p.id} style={{ background: "#211C15", border: "1px solid #3A3122", borderRadius: 14, padding: 12, display: "flex", alignItems: "center", gap: 12 }}>
                {p.image_url ? (
                  <img src={p.image_url} alt={p.name} style={{ width: 44, height: 44, borderRadius: 10, objectFit: "cover" }} />
                ) : (
                  <div style={{ width: 44, height: 44, borderRadius: 10, background: "#1A1611", display: "flex", alignItems: "center", justifyContent: "center" }}><PlaceholderIcon size={32} /></div>
                )}
                <div style={{ flex: 1 }}>
                  <div style={{ color: "#F5EEDD", fontWeight: 700 }}>{p.name}</div>
                  <div style={{ color: "#A79980", fontSize: 12 }}>{money(minPrice)} 起 · {p.sizes.length} 種份量 · {p.addons.length} 種加料</div>
                </div>
                <button onClick={() => setEditing(p)} style={{ background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>編輯</button>
                <button onClick={() => deleteProduct(p)} style={{ background: "none", border: "1px solid #3A3122", color: "#D64933", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>刪除</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function OwnerView({ onLogout }) {
  const [tab, setTab] = useState("orders");
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  const loadOrders = async () => {
    setLoading(true);
    setErr("");
    const { data, error } = await db.from("orders").select("*").order("created_at", { ascending: false });
    if (error) {
      setErr("讀取訂單時發生問題:" + error.message);
      setOrders([]);
    } else {
      setOrders(
        data.map((o) => ({
          id: o.id, name: o.name, phone: o.phone, dateLabel: o.date_label, dateKey: o.date_key,
          time: o.pickup_time, total: o.total, cart: o.cart, done: o.done,
        }))
      );
    }
    setLoading(false);
  };

  useEffect(() => { loadOrders(); }, []);

  const toggleDone = async (order) => {
    const { error } = await db.from("orders").update({ done: !order.done }).eq("id", order.id);
    if (!error) setOrders((prev) => prev.map((o) => (o.id === order.id ? { ...o, done: !o.done } : o)));
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <button onClick={() => setTab("orders")} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: `1.5px solid ${tab === "orders" ? "#F0A202" : "#3A3122"}`, background: tab === "orders" ? "#F0A20222" : "transparent", color: tab === "orders" ? "#F0A202" : "#D9CFB8", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>
          訂單列表
        </button>
        <button onClick={() => setTab("products")} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: `1.5px solid ${tab === "products" ? "#F0A202" : "#3A3122"}`, background: tab === "products" ? "#F0A20222" : "transparent", color: tab === "products" ? "#F0A202" : "#D9CFB8", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>
          商品管理
        </button>
        <button onClick={onLogout} style={{ background: "none", border: "1px solid #3A3122", color: "#D64933", borderRadius: 10, padding: "0 14px", cursor: "pointer", fontSize: 12 }}>登出</button>
      </div>

      {tab === "products" ? <ProductsManager /> : (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h3 style={{ color: "#F5EEDD", margin: 0, fontSize: 16 }}>訂單列表({orders.length})</h3>
            <button onClick={loadOrders} style={{ background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>重新整理</button>
          </div>
          {err && <p style={{ color: "#D64933", fontSize: 13, marginBottom: 12 }}>{err}</p>}
          {loading ? (
            <p style={{ color: "#A79980" }}>載入中...</p>
          ) : orders.length === 0 ? (
            <p style={{ color: "#A79980" }}>目前還沒有訂單。</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {orders.map((o) => (
                <div key={o.id} style={{ background: "#211C15", border: "1px solid #3A3122", borderRadius: 14, padding: 14, opacity: o.done ? 0.5 : 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ color: "#F5EEDD", fontWeight: 700 }}>{o.name} · {o.phone}</span>
                    <span style={{ color: "#F0A202", fontWeight: 700 }}>{money(o.total)}</span>
                  </div>
                  <div style={{ color: "#A79980", fontSize: 12, marginBottom: 8 }}>取餐: {absoluteDateLabel(o.dateKey)} {o.time}</div>
                  <div style={{ fontSize: 13, color: "#D9CFB8", marginBottom: 10 }}>
                    {o.cart.map((i) => (
                      <div key={i.cartId}>{i.name} {i.size} x{i.qty}{i.spicy ? ` · ${i.spicy}` : ""}{i.addons?.length ? ` · ${i.addons.join("、")}` : ""}</div>
                    ))}
                  </div>
                  <button onClick={() => toggleDone(o)} style={{ background: o.done ? "none" : "#F0A20222", border: `1px solid ${o.done ? "#3A3122" : "#F0A202"}`, color: o.done ? "#A79980" : "#F0A202", borderRadius: 10, padding: "6px 14px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                    {o.done ? "已完成 ✓" : "標記為已完成"}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


function App() {
  const [view, setView] = useState("menu");
  const [cart, setCart] = useState([]);
  const [lastOrder, setLastOrder] = useState(null);
  const [saveError, setSaveError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [session, setSession] = useState(undefined); // undefined = still checking

  useEffect(() => {
    try {
      const saved = localStorage.getItem("lastOrder");
      if (saved) setLastOrder(JSON.parse(saved));
    } catch (e) {}
  }, []);

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = db.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
  const addToCart = (item) => setCart((prev) => [...prev, item]);
  const logout = () => db.auth.signOut();
  const clearSavedOrder = () => {
    try { localStorage.removeItem("lastOrder"); } catch (e) {}
    setLastOrder(null);
  };

  const confirmOrder = async (orderDraft) => {
    setSubmitting(true);
    setSaveError("");
    const order = { ...orderDraft, id: `${Date.now()}`, createdAt: Date.now(), done: false };
    const { error } = await db.from("orders").insert([{
      id: order.id, name: order.name, phone: order.phone,
      date_label: order.dateLabel, date_key: order.dateKey, pickup_time: order.time,
      total: order.total, cart: order.cart, done: false, created_at: order.createdAt,
    }]);
    setSubmitting(false);
    if (error) {
      setSaveError("訂單送出時發生問題,請稍後再試一次,或直接致電店家。(" + error.message + ")");
      return;
    }
    setLastOrder(order);
    try { localStorage.setItem("lastOrder", JSON.stringify(order)); } catch (e) {}
    setCart([]);
    setView("ticket");
  };

  return (
    <div style={{ fontFamily: "'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif", background: "#1A1611", minHeight: "100vh", padding: "0 0 90px" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 0" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 30 }}>🐻</span>
            <div>
              <h1 style={{ color: "#F5EEDD", margin: 0, fontSize: 19, fontWeight: 800, letterSpacing: 1 }}>雄大大鹹酥雞</h1>
              <p style={{ color: "#A79980", margin: 0, fontSize: 11 }}>週二至週日 16:00–23:00 · 週一公休</p>
            </div>
          </div>
          <button onClick={() => setView(view === "owner" ? "menu" : "owner")} style={{ background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "8px 10px", cursor: "pointer", fontSize: 12 }}>
            🏪 {view === "owner" ? "顧客點餐" : "店家後台"}
          </button>
        </div>

        {saveError && <p style={{ color: "#D64933", fontSize: 12, marginBottom: 12 }}>{saveError}</p>}

        {view === "owner" && (session ? <OwnerView onLogout={logout} /> : session === null ? <LoginView onLoggedIn={() => {}} /> : <p style={{ color: "#A79980", textAlign: "center", marginTop: 40 }}>載入中...</p>)}
        {view === "menu" && lastOrder && (
          <button onClick={() => setView("ticket")} style={{ width: "100%", background: "#211C15", border: "1px dashed #F0A202", borderRadius: 14, padding: "12px 14px", marginBottom: 14, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", textAlign: "left" }}>
            <span style={{ color: "#F0A202", fontSize: 13, fontWeight: 700 }}>🎫 你有一筆進行中的訂單({lastOrder.dateLabel} {lastOrder.time})</span>
            <span style={{ color: "#D9CFB8", fontSize: 12 }}>查看 →</span>
          </button>
        )}
        {view === "menu" && <MenuView onAddToCart={addToCart} />}
        {view === "cart" && <CartView cart={cart} setCart={setCart} onCheckout={() => setView("checkout")} />}
        {view === "checkout" && <CheckoutView cart={cart} onBack={() => setView("cart")} onConfirm={confirmOrder} submitting={submitting} />}
        {view === "ticket" && lastOrder && <TicketView order={lastOrder} onDone={() => setView("menu")} onClear={() => { clearSavedOrder(); setView("menu"); }} />}
      </div>

      {view !== "owner" && view !== "checkout" && view !== "ticket" && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#211C15", borderTop: "1px solid #3A3122", padding: "10px 16px" }}>
          <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", gap: 10 }}>
            <button onClick={() => setView("menu")} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${view === "menu" ? "#F0A202" : "#3A3122"}`, background: view === "menu" ? "#F0A20222" : "transparent", color: view === "menu" ? "#F0A202" : "#D9CFB8", fontWeight: 700, cursor: "pointer" }}>
              👨‍🍳 菜單
            </button>
            <button onClick={() => setView("cart")} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${view === "cart" ? "#D64933" : "#3A3122"}`, background: view === "cart" ? "#D6493322" : "transparent", color: view === "cart" ? "#FF9A85" : "#D9CFB8", fontWeight: 700, cursor: "pointer", position: "relative" }}>
              🛒 購物車{cartCount > 0 ? ` (${cartCount})` : ""}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
