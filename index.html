const SPICY_LEVELS = ["不辣", "小辣", "中辣", "大辣"];
const OPEN_HOUR = 16;
const CLOSE_HOUR = 23;
const CLOSED_WEEKDAY = 1;

function getUpcomingDates() {
  const days = [];
  const now = new Date();
  for (let i = 0; i < 8 && days.length < 6; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() + i);
    if (d.getDay() === CLOSED_WEEKDAY) continue;
    const label = i === 0 ? "今天" : i === 1 ? "明天" : `${d.getMonth() + 1}/${d.getDate()} (${"日一二三四五六"[d.getDay()]})`;
    days.push({ key: d.toISOString().slice(0, 10), label, date: d, isToday: i === 0 });
  }
  return days;
}

function getSlotsForDate(dateInfo) {
  const slots = [];
  const now = new Date();
  const earliest = new Date(now.getTime() + 20 * 60000);
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
    for (let m = 0; m < 60; m += 15) {
      const slotDate = new Date(dateInfo.date);
      slotDate.setHours(h, m, 0, 0);
      if (dateInfo.isToday && slotDate < earliest) continue;
      slots.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
    }
  }
  return slots;
}

function CheckoutView({ cart, onBack, onConfirm, submitting }) {
  const dates = useMemo(() => getUpcomingDates(), []);
  const [dateKey, setDateKey] = useState(dates[0]?.key);
  const dateInfo = dates.find((d) => d.key === dateKey) || dates[0];
  const slots = useMemo(() => (dateInfo ? getSlotsForDate(dateInfo) : []), [dateInfo]);
  const [time, setTime] = useState(slots[0] || "");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [error, setError] = useState("");

  useEffect(() => { setTime(slots[0] || ""); }, [dateKey]);

  const total = cart.reduce((sum, i) => sum + i.unitPrice * i.qty, 0);

  const submit = () => {
    if (!name.trim()) return setError("請填寫姓名");
    if (!phone.trim()) return setError("請填寫電話");
    if (!time) return setError("請選擇取餐時間");
    setError("");
    onConfirm({ name, phone, dateLabel: dateInfo.label, dateKey, time, total, cart });
  };

  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", color: "#A79980", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", marginBottom: 16, fontSize: 14 }}>

      </div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, color: "#F0A202", fontWeight: 700, letterSpacing: 1, display: "block", marginBottom: 6 }}>電話</label>
        <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="0912-345-678" style={inputStyle} />
      </div>

      <div style={{ marginBottom: 10 }}>
        <label style={{ fontSize: 13, color: "#F0A202", fontWeight: 700, letterSpacing: 1, display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
          🕐 取餐日期(公休:每週一)
        </label>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {dates.map((d) => (
            <button key={d.key} onClick={() => setDateKey(d.key)} style={{ padding: "8px 14px", borderRadius: 999, border: `1.5px solid ${dateKey === d.key ? "#F0A202" : "#3A3122"}`, background: dateKey === d.key ? "#F0A20222" : "transparent", color: dateKey === d.key ? "#F0A202" : "#D9CFB8", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
              {d.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <label style={{ fontSize: 13, color: "#F0A202", fontWeight: 700, letterSpacing: 1, display: "block", marginBottom: 8 }}>取餐時間(營業 16:00–23:00)</label>
        {slots.length === 0 ? (
          <p style={{ color: "#D64933", fontSize: 13 }}>這個時段今天已經沒有可預約的時間了,請選其他日期。</p>
        ) : (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", maxHeight: 160, overflowY: "auto" }}>
            {slots.map((t) => (
              <button key={t} onClick={() => setTime(t)} style={{ padding: "7px 12px", borderRadius: 10, border: `1.5px solid ${time === t ? "#D64933" : "#3A3122"}`, background: time === t ? "#D6493322" : "transparent", color: time === t ? "#FF9A85" : "#D9CFB8", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>

function OwnerView() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");

  const loadOrders = async () => {
    setLoading(true);
    setErr("");
    const { data, error } = await db.from("orders").select("*").order("created_at", { ascending: false });
    if (error) {
      setErr("讀取訂單時發生問題:" + error.message);
      setOrders([]);
    } else {
      setOrders(
        data.map((o) => ({
          id: o.id, name: o.name, phone: o.phone, dateLabel: o.date_label,
          time: o.pickup_time, total: o.total, cart: o.cart, done: o.done,
        }))
      );
    }
    setLoading(false);
  };

  useEffect(() => { loadOrders(); }, []);

  const toggleDone = async (order) => {
    const { error } = await db.from("orders").update({ done: !order.done }).eq("id", order.id);
    if (!error) setOrders((prev) => prev.map((o) => (o.id === order.id ? { ...o, done: !o.done } : o)));
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h3 style={{ color: "#F5EEDD", margin: 0, fontSize: 16 }}>訂單列表({orders.length})</h3>
        <button onClick={loadOrders} style={{ background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontSize: 12 }}>重新整理</button>
      </div>
      {err && <p style={{ color: "#D64933", fontSize: 13, marginBottom: 12 }}>{err}</p>}
      {loading ? (
        <p style={{ color: "#A79980" }}>載入中...</p>
      ) : orders.length === 0 ? (
        <p style={{ color: "#A79980" }}>目前還沒有訂單。</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {orders.map((o) => (
            <div key={o.id} style={{ background: "#211C15", border: "1px solid #3A3122", borderRadius: 14, padding: 14, opacity: o.done ? 0.5 : 1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ color: "#F5EEDD", fontWeight: 700 }}>{o.name} · {o.phone}</span>
                <span style={{ color: "#F0A202", fontWeight: 700 }}>{money(o.total)}</span>
              </div>
              <div style={{ color: "#A79980", fontSize: 12, marginBottom: 8 }}>取餐: {o.dateLabel} {o.time}</div>
              <div style={{ fontSize: 13, color: "#D9CFB8", marginBottom: 10 }}>
                {o.cart.map((i) => (
                  <div key={i.cartId}>{i.name} {i.size} x{i.qty}{i.spicy ? ` · ${i.spicy}` : ""}{i.addons?.length ? ` · ${i.addons.join("、")}` : ""}</div>
                ))}
              </div>
              <button onClick={() => toggleDone(o)} style={{ background: o.done ? "none" : "#F0A20222", border: `1px solid ${o.done ? "#3A3122" : "#F0A202"}`, color: o.done ? "#A79980" : "#F0A202", borderRadius: 10, padding: "6px 14px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                {o.done ? "已完成 ✓" : "標記為已完成"}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("menu");
  const [cart, setCart] = useState([]);
  const [lastOrder, setLastOrder] = useState(null);
  const [saveError, setSaveError] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
  const addToCart = (item) => setCart((prev) => [...prev, item]);

  const confirmOrder = async (orderDraft) => {
    setSubmitting(true);
    setSaveError("");
    const order = { ...orderDraft, id: `${Date.now()}`, createdAt: Date.now(), done: false };
    const { error } = await db.from("orders").insert([{
      id: order.id, name: order.name, phone: order.phone,
      date_label: order.dateLabel, date_key: order.dateKey, pickup_time: order.time,
      total: order.total, cart: order.cart, done: false, created_at: order.createdAt,
    }]);
    setSubmitting(false);
    if (error) {
      setSaveError("訂單送出時發生問題,請稍後再試一次,或直接致電店家。(" + error.message + ")");
      return;
    }
    setLastOrder(order);
    setCart([]);
    setView("ticket");
  };

  return (
    <div style={{ fontFamily: "'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif", background: "#1A1611", minHeight: "100vh", padding: "0 0 90px" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 0" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 30 }}>🐻</span>
            <div>
              <h1 style={{ color: "#F5EEDD", margin: 0, fontSize: 19, fontWeight: 800, letterSpacing: 1 }}>雄大大鹹酥雞</h1>
              <p style={{ color: "#A79980", margin: 0, fontSize: 11 }}>週二至週日 16:00–23:00 · 週一公休</p>
            </div>
          </div>
          <button onClick={() => setView(view === "owner" ? "menu" : "owner")} style={{ background: "none", border: "1px solid #3A3122", color: "#D9CFB8", borderRadius: 10, padding: "8px 10px", cursor: "pointer", fontSize: 12 }}>
            🏪 {view === "owner" ? "顧客點餐" : "店家後台"}
          </button>
        </div>

        {saveError && <p style={{ color: "#D64933", fontSize: 12, marginBottom: 12 }}>{saveError}</p>}

        {view === "owner" && <OwnerView />}
        {view === "menu" && <MenuView onAddToCart={addToCart} />}
        {view === "cart" && <CartView cart={cart} setCart={setCart} onCheckout={() => setView("checkout")} />}
        {view === "checkout" && <CheckoutView cart={cart} onBack={() => setView("cart")} onConfirm={confirmOrder} submitting={submitting} />}
        {view === "ticket" && lastOrder && <TicketView order={lastOrder} onDone={() => setView("menu")} />}
      </div>

      {view !== "owner" && view !== "checkout" && view !== "ticket" && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#211C15", borderTop: "1px solid #3A3122", padding: "10px 16px" }}>
          <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", gap: 10 }}>
            <button onClick={() => setView("menu")} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${view === "menu" ? "#F0A202" : "#3A3122"}`, background: view === "menu" ? "#F0A20222" : "transparent", color: view === "menu" ? "#F0A202" : "#D9CFB8", fontWeight: 700, cursor: "pointer" }}>
              👨‍🍳 菜單
            </button>
            <button onClick={() => setView("cart")} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${view === "cart" ? "#D64933" : "#3A3122"}`, background: view === "cart" ? "#D6493322" : "transparent", color: view === "cart" ? "#FF9A85" : "#D9CFB8", fontWeight: 700, cursor: "pointer", position: "relative" }}>
              🛒 購物車{cartCount > 0 ? ` (${cartCount})` : ""}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
